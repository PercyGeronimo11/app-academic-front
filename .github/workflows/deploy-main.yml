name: Deploy Vue (main / producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vue-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy main over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/var/www/tesis-unt/frontend-vue-prod"
            BRANCH="main"

            cd "$APP_DIR"
            PREV="$(git rev-parse HEAD)"
            echo "==> Commit actual: $PREV"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "==> npm ci + build (prod)"
            if ! (npm ci && npm run build); then
              echo "ERROR build → rollback código a $PREV"
              git reset --hard "$PREV"
              exit 1
            fi

            test -f dist/index.html
            echo "==> Deploy OK main: $(git rev-parse --short HEAD)"
